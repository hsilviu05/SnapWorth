<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #D96C47; } a:hover { color: #b8552f; }
  </style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; padding: 90px 84px; display: flex; flex-direction: column; background: radial-gradient(120% 80% at 84% 6%, #2B211C 0%, #1C1410 60%); font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden;">

  <div style="display: inline-flex; align-items: center; gap: 14px; align-self: flex-start; padding: 15px 28px; border-radius: 100px; font-weight: 600; font-size: 26px; letter-spacing: 0.5px; background: #7A9E7E26; color: #7A9E7E;">
    <span style="width: 13px; height: 13px; border-radius: 50%; background: #7A9E7E;"></span>NEW IN 1.3 — WEEKLY SUMMARY
  </div>

  <h1 style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; line-height: 1.02; letter-spacing: -2px; color: #ffffff; font-size: 92px; margin: 34px 0 0 0;">Sunday,<br><span style="font-style: italic; color: {{accent}};">11:00.</span></h1>

  <div style="flex: 1;"></div>

  <div style="border-radius: 34px; padding: 32px 34px; background: #ffffff14; border: 1px solid #ffffff26; box-shadow: 0 46px 110px rgba(0,0,0,.32); margin-bottom: 30px;">
    <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 20px;">
      <div style="width: 54px; height: 54px; border-radius: 14px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5.5-5.5 3.5 3.5L21 6"></path><path d="M15 6h6v6"></path></svg>
      </div>
      <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 1px; text-transform: uppercase; color: #E8E1DA;">SnapWorth</span>
      <span style="flex: 1;"></span>
      <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; font-size: 26px; color: #8a7f77;">now</span>
    </div>
    <div style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 700; font-size: 36px; line-height: 1.25; color: #ffffff;">Your week in finds</div>
    <div style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 400; font-size: 32px; line-height: 1.4; color: #C0B6AB; margin-top: 8px;">3 new finds, $312 added. 12 items still waiting to be listed.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; margin-bottom: 38px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7A9E7E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M20 6L9 17l-5-5"></path></svg>
      <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; font-size: 30px; color: #C0B6AB;">Optional — off unless you turn it on</span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7A9E7E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M20 6L9 17l-5-5"></path></svg>
      <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; font-size: 30px; color: #C0B6AB;">One a week. Never more.</span>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; border-radius: 20px; padding: 26px 34px; background: {{accent}};">
    <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 700; font-size: 31px; color: #ffffff;">Update to 1.3</span>
    <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 700; font-size: 31px; color: #3a1c0f;">link in bio →</span>
  </div>

  <span style="position: absolute; left: 0; bottom: 56px; width: 1080px; text-align: center; font-family: 'DM Sans', system-ui, sans-serif; font-weight: 600; font-size: 25px; letter-spacing: 7px; text-transform: uppercase; color: #8a7f77;">SnapWorth</span>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#D96C47","options":["#D96C47","#7A9E7E","#C8963E","#B8552F"],"section":"Brand"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#D96C47';
    // color-mix, not accent + '26': the colour editor can hand back rgb()
    // or a short hex, and string-concatenating alpha onto those yields an
    // invalid colour that paints as nothing.
    const accentSoft = 'color-mix(in srgb, ' + accent + ' 15%, transparent)';
    return { accent, accentSoft };
  }
}
</script>
</body>
</html>
