<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #D96C47; } a:hover { color: #b8552f; }
  </style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; padding: 90px 84px; display: flex; flex-direction: column; background: radial-gradient(120% 80% at 84% 6%, #2B211C 0%, #1C1410 60%); font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden;">

  <div style="display: inline-flex; align-items: center; gap: 14px; align-self: flex-start; padding: 15px 28px; border-radius: 100px; font-family: 'DM Sans', system-ui, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0.5px; background: {{accentSoft}}; color: {{accent}};">
    <span style="width: 13px; height: 13px; border-radius: 50%; background: {{accent}};"></span>SNAPWORTH 1.3 IS HERE
  </div>

  <h1 style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; line-height: 1.02; letter-spacing: -2px; color: #ffffff; font-size: 96px; margin: 34px 0 0 0;">Your finds,<br><span style="font-style: italic; color: {{accent}};">as a portfolio.</span></h1>

  <div style="flex: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 22px; margin-bottom: 40px;">

    <div style="border-radius: 26px; padding: 28px; background: #ffffff0d; border: 1px solid #ffffff1a;">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 20px;">
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 50px; color: #ffffff;">The Portfolio</div>
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M3 17l5.5-5.5 3.5 3.5L21 6"></path><path d="M15 6h6v6"></path></svg>
      </div>
      <p style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 400; font-size: 29px; line-height: 1.4; color: #C0B6AB; margin: 8px 0 0 0;">One number for everything you've scanned — plus what's still waiting to be listed.</p>
    </div>

    <div style="border-radius: 26px; padding: 28px; background: #ffffff0d; border: 1px solid #ffffff1a;">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 20px;">
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 50px; color: #ffffff;">Weekly Summary</div>
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#7A9E7E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 11h18"></path><circle cx="12" cy="16" r="1.6" fill="#7A9E7E" stroke="none"></circle></svg>
      </div>
      <p style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 400; font-size: 29px; line-height: 1.4; color: #C0B6AB; margin: 8px 0 0 0;">An optional Sunday recap, so you know where you stand without opening the app.</p>
    </div>

  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; border-radius: 20px; padding: 26px 34px; background: {{accent}};">
    <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 700; font-size: 31px; color: #ffffff;">Free on the App Store</span>
    <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 700; font-size: 31px; color: #3a1c0f;">link in bio →</span>
  </div>

  <span style="position: absolute; left: 0; bottom: 56px; width: 1080px; text-align: center; font-family: 'DM Sans', system-ui, sans-serif; font-weight: 600; font-size: 25px; letter-spacing: 7px; text-transform: uppercase; color: #8a7f77;">SnapWorth</span>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#D96C47","options":["#D96C47","#7A9E7E","#C8963E","#B8552F"],"section":"Brand"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#D96C47';
    // color-mix, not accent + '26': the colour editor can hand back rgb()
    // or a short hex, and string-concatenating alpha onto those yields an
    // invalid colour that paints as nothing.
    const accentSoft = 'color-mix(in srgb, ' + accent + ' 15%, transparent)';
    return { accent, accentSoft };
  }
}
</script>
</body>
</html>
