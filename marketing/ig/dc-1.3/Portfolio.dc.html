<!doctype html>
<html>
<head>

</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap">
  <style>

    * { box-sizing: border-box; }
    a { color: #D96C47; } a:hover { color: #b8552f; }
  </style>
</helmet>
<div style="width: 1080px; height: 1350px; position: relative; padding: 90px 84px; display: flex; flex-direction: column; background: radial-gradient(120% 80% at 84% 6%, #2B211C 0%, #1C1410 60%); font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden;">

  <div style="display: inline-flex; align-items: center; gap: 14px; align-self: flex-start; padding: 15px 28px; border-radius: 100px; font-weight: 600; font-size: 26px; letter-spacing: 0.5px; background: {{accentSoft}}; color: {{accent}};">
    <span style="width: 13px; height: 13px; border-radius: 50%; background: {{accent}};"></span>NEW IN 1.3 — MY FINDS
  </div>

  <h1 style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; line-height: 1.02; letter-spacing: -2px; color: #ffffff; font-size: 90px; margin: 34px 0 0 0;">How much is it<br><span style="font-style: italic; color: {{accent}};">all</span> worth?</h1>

  <div style="flex: 1;"></div>

  <div style="border-radius: 30px; padding: 44px 40px; background: #ffffff0d; border: 1px solid #ffffff1a; margin-bottom: 26px;">
    <div style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: #8a7f77;">Everything you've found</div>
    <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 148px; line-height: 1; letter-spacing: -5px; color: #ffffff; margin-top: 14px;">$4,820</div>
    <div style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; font-size: 30px; color: #C0B6AB; margin-top: 10px;">across 34 items · 12 still unlisted</div>

    <div style="height: 1px; background: #ffffff1a; margin: 34px 0 30px 0;"></div>

    <div style="display: flex; flex-direction: column; gap: 22px;">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 20px;">
        <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; font-size: 31px; color: #E8E1DA; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">The North Face Nuptse</span>
        <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 700; font-size: 31px; color: #ffffff; flex-shrink: 0;">$135–180</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 20px;">
        <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; font-size: 31px; color: #E8E1DA; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Carhartt Detroit Jacket</span>
        <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 700; font-size: 31px; color: #ffffff; flex-shrink: 0;">$88–120</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 20px;">
        <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; font-size: 31px; color: #E8E1DA; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Levi's 501 Selvedge</span>
        <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 700; font-size: 31px; color: #ffffff; flex-shrink: 0;">$60–95</span>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 34px; padding-left: 6px;">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7A9E7E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M3 17l5.5-5.5 3.5 3.5L21 6"></path><path d="M15 6h6v6"></path></svg>
    <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; font-size: 27px; color: #8a7f77;">Value history over time — with Pro</span>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; border-radius: 20px; padding: 26px 34px; background: {{accent}};">
    <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 700; font-size: 31px; color: #ffffff; flex-shrink: 0;">Update to 1.3</span>
    <span style="font-family: 'DM Sans', system-ui, sans-serif; font-weight: 700; font-size: 31px; color: #3a1c0f;">link in bio →</span>
  </div>

  <span style="position: absolute; left: 0; bottom: 56px; width: 1080px; text-align: center; font-family: 'DM Sans', system-ui, sans-serif; font-weight: 600; font-size: 25px; letter-spacing: 7px; text-transform: uppercase; color: #8a7f77;">SnapWorth</span>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#D96C47","options":["#D96C47","#7A9E7E","#C8963E","#B8552F"],"section":"Brand"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#D96C47';
    // color-mix, not accent + '26': the colour editor can hand back rgb()
    // or a short hex, and string-concatenating alpha onto those yields an
    // invalid colour that paints as nothing.
    const accentSoft = 'color-mix(in srgb, ' + accent + ' 15%, transparent)';
    return { accent, accentSoft };
  }
}
</script>
</body>
</html>
