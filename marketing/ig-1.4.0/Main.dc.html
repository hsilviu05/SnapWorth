<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E8845F; } a:hover { color: #D96C47; }
  </style>
</helmet>

<div style="width: 1080px; height: 1350px; background: #17120F; position: relative; overflow: hidden; font-family: 'DM Sans', -apple-system, 'Helvetica Neue', sans-serif;">

  <!-- warm floor glow, so the ground is atmosphere rather than a flat fill -->
  <div style="position: absolute; left: -180px; bottom: -420px; width: 1440px; height: 900px; background: radial-gradient(ellipse at center, rgba(168,72,44,0.30) 0%, rgba(168,72,44,0.10) 42%, rgba(23,18,15,0) 72%); pointer-events: none;"></div>

  <div style="position: relative; display: flex; flex-direction: column; height: 100%; padding: 84px 84px 72px; box-sizing: border-box;">

    <!-- eyebrow -->
    <div style="display: flex; align-items: center; gap: 12px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8845F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8V5.5A1.5 1.5 0 0 1 4.5 4H7"></path>
        <path d="M17 4h2.5A1.5 1.5 0 0 1 21 5.5V8"></path>
        <path d="M21 16v2.5a1.5 1.5 0 0 1-1.5 1.5H17"></path>
        <path d="M7 20H4.5A1.5 1.5 0 0 1 3 18.5V16"></path>
        <circle cx="12" cy="12" r="3.2"></circle>
      </svg>
      <span style="font-size: 21px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #B0A297;">SnapWorth 1.4.0</span>
    </div>

    <!-- headline -->
    <h1 style="font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 92px; line-height: 0.98; letter-spacing: -0.02em; color: #FBF7F2; margin: 44px 0 0; text-wrap: balance;">
      Your haul,<br>on your<br>Lock&nbsp;Screen.
    </h1>

    <p style="font-size: 27px; line-height: 1.5; color: #B0A297; margin: 30px 0 0; max-width: 620px;">
      What everything you've scanned is worth — without opening the app.
    </p>

    <!-- lock screen mock -->
    <div style="flex-grow: 1; display: flex; align-items: flex-end; justify-content: center; margin-top: 8px;">
      <div style="width: 560px; padding: 0 0 18px;">

        <!-- the clock is the subject here: widgets sit beneath it -->
        <div style="text-align: center; color: #FBF7F2; font-weight: 500;">
          <div style="font-size: 26px; letter-spacing: 0.01em; opacity: 0.72;">Saturday, 14 September</div>
          <div style="font-size: 132px; line-height: 1.02; letter-spacing: -0.03em; margin-top: 2px;">9:41</div>
        </div>

        <!-- rectangular accessory widget -->
        <div style="margin-top: 26px; background: rgba(251,247,242,0.13); border-radius: 22px; padding: 18px 22px; backdrop-filter: blur(8px);">
          <div style="display: flex; align-items: center; gap: 9px; color: #FBF7F2;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8V5.5A1.5 1.5 0 0 1 4.5 4H7"></path>
              <path d="M17 4h2.5A1.5 1.5 0 0 1 21 5.5V8"></path>
              <path d="M21 16v2.5a1.5 1.5 0 0 1-1.5 1.5H17"></path>
              <path d="M7 20H4.5A1.5 1.5 0 0 1 3 18.5V16"></path>
              <circle cx="12" cy="12" r="3.2"></circle>
            </svg>
            <span style="font-size: 20px; font-weight: 600;">SnapWorth</span>
          </div>
          <div style="font-size: 27px; font-weight: 700; color: #8FB08A; margin-top: 3px; font-variant-numeric: tabular-nums;">$3,480–$6,200</div>
          <div style="font-size: 20px; color: #D8CEC5; margin-top: 1px;">41 finds · 6-day streak</div>
        </div>

        <!-- circular complications -->
        <div style="display: flex; gap: 22px; margin-top: 22px; justify-content: flex-start;">
          <div style="width: 118px; height: 118px; border-radius: 50%; background: rgba(251,247,242,0.13); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; backdrop-filter: blur(8px);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FBF7F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8V5.5A1.5 1.5 0 0 1 4.5 4H7"></path>
              <path d="M17 4h2.5A1.5 1.5 0 0 1 21 5.5V8"></path>
              <path d="M21 16v2.5a1.5 1.5 0 0 1-1.5 1.5H17"></path>
              <path d="M7 20H4.5A1.5 1.5 0 0 1 3 18.5V16"></path>
              <circle cx="12" cy="12" r="3.2"></circle>
            </svg>
            <span style="font-size: 27px; font-weight: 700; color: #FBF7F2; font-variant-numeric: tabular-nums;">$4.8K</span>
          </div>
          <div style="width: 118px; height: 118px; border-radius: 50%; background: rgba(251,247,242,0.13); display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px);">
            <span style="font-size: 38px; font-weight: 700; color: #FBF7F2; line-height: 1;">1</span>
            <span style="font-size: 16px; color: #D8CEC5; margin-top: 2px;">scan left</span>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
