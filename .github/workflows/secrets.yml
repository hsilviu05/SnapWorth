name: Secrets

# Deliberately NO `paths:` filter.
#
# This job used to live inside the iOS workflow, which is gated on `ios/**`.
# So it ran only when Swift changed — and the credentials worth catching
# (GEMINI_API_KEY, TELEGRAM_BOT_TOKEN, the App Store Server API key, the
# DeviceCheck .p8) all live in backend files, which never triggered it.
#
# That is not hypothetical. Two private-key literals reached main in a
# backend-only commit and sat unscanned for five days; the next PR to touch
# an iOS file found them immediately. A scanner that runs on the paths least
# likely to carry a secret is worse than none, because it reads as coverage.
#
# If this workflow is ever narrowed again, that is the failure being rebuilt.

on:
  push:
    branches: [main]
  pull_request:

# A pull request's runs share a group, and a newer push to the PR cancels the
# older run: the survivor scans every commit the cancelled one would have.
#
# Pushes to main each get a group of their own, keyed on the commit. They used
# to share `secrets-refs/heads/main` with `cancel-in-progress`, which is not
# the "push and its PR" dedupe the old comment here claimed — a PR's ref is
# `refs/pull/N/merge`, so the two never shared a group. What it actually did
# was cancel main's own scans whenever two merges landed close together
# (36237107443, 36237113349 and 36237119008 were cancelled that way). Even
# without the cancel flag, a shared group replaces a *pending* run with the
# newest one, so the key has to differ per commit for none to be dropped.
concurrency:
  group: secrets-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets-check:
    name: No secrets in source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit, not just the tip. The history scan below reads them
          # all; a depth-1 clone has one commit and no history to read.
          fetch-depth: 0

      - name: Scan the tree for leaked secrets
        # Replaces two hand-written greps that matched on shape alone and could
        # not tell a credential from a redaction-test fixture. gitleaks adds
        # entropy scoring, ~170 provider rules instead of the two we thought
        # of, and scoped allowlisting — see .gitleaks.toml.
        #
        # The pinned binary rather than gitleaks-action@v2, for two reasons:
        # the action requires a paid GITLEAKS_LICENSE on organization-owned
        # repos, and running the binary means CI executes exactly the command
        # a developer runs locally, so a passing local check means a passing
        # build.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path /tmp/gitleaks-tree.sarif \
            --no-banner
        # --redact keeps any detected value out of the public build log; the
        # finding's file and line are still reported, which is all a fix needs.

      - name: Scan history for leaked secrets
        # The tree scan above only sees files as they are now. A key committed
        # in one commit and deleted in the next never appears in any tree it
        # reads, yet it is published: this repository is public, the commit
        # stays fetchable by its SHA, and key-harvesting bots read public
        # pushes within minutes. So every commit reachable from the one checked
        # out is scanned as a diff — for a PR that is the merge ref, which
        # covers the PR's own commits and main beneath them.
        #
        # All of history rather than just this push's range (`before..sha`),
        # deliberately. A range scan loses coverage whenever a run is cancelled
        # or skipped, a force-push leaves `before` unreachable, or a branch's
        # first push has no `before` at all; a whole-history scan has none of
        # those gaps, and at ~500 commits it takes a few seconds.
        #
        # Historical hits that were reviewed and are not credentials are
        # excused by exact fingerprint in .gitleaksignore, which gitleaks reads
        # from the repository root.
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          [ -x /tmp/gitleaks ] || curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . \
            --log-opts="HEAD" \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path /tmp/gitleaks-history.sarif \
            --no-banner

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: |
            /tmp/gitleaks-tree.sarif
            /tmp/gitleaks-history.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: .env must not be tracked
        run: |
          if git ls-files --error-unmatch backend/.env 2>/dev/null; then
            echo "::error::backend/.env is tracked — rotate the API key immediately"
            exit 1
          fi
