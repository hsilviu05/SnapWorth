name: Evaluation gates

# Quality gates for valuation changes.
#
# The platform itself is tested on every PR — that runs without a model, an API
# key or a network, so it is fast and always meaningful.
#
# The *accuracy* gate only runs when a gold dataset exists. Until then it
# reports SKIPPED, never PASSED: a green tick on an unmeasured benchmark is the
# single most dangerous output this workflow could produce, because it looks
# identical to a real pass.

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/eval.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      run_live_eval:
        description: 'Run the live model evaluation (costs API calls)'
        type: boolean
        default: false

jobs:
  # ── Always runs: the platform's own correctness ───────────────────────────
  platform-tests:
    name: Evaluation platform tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Test the evaluation platform
        env:
          GEMINI_API_KEY: ci-placeholder-not-real
        run: pytest tests/test_eval_platform.py tests/test_eval.py -v --tb=short

  # ── Guards against fabricated benchmark data ──────────────────────────────
  data-integrity:
    name: No fabricated benchmark data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Shipped sample data must not be scoreable
        env:
          GEMINI_API_KEY: ci-placeholder-not-real
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from eval import dataset, schema

          failures = []

          v1 = dataset.load('eval/data/sample.jsonl')
          if any(i.is_scoreable for i in v1):
              failures.append('eval/data/sample.jsonl contains scoreable records')

          gold = schema.load_gold('eval/data/gold.template.jsonl')
          if any(i.is_scoreable for i in gold):
              failures.append('gold.template.jsonl contains scoreable records')

          if failures:
              print('::error::' + '; '.join(failures))
              print('Template and sample files must never contribute to a '
                    'reported metric. Add real records to eval/data/gold.jsonl.')
              sys.exit(1)
          print(f'ok: {len(v1)} sample + {len(gold)} template records, none scoreable')
          PY

      - name: Gold set label drift
        env:
          GEMINI_API_KEY: ci-placeholder-not-real
        run: |
          if [ ! -f eval/data/gold.jsonl ]; then
            echo "::notice::No gold dataset yet — drift check skipped."
            exit 0
          fi
          git fetch origin ${{ github.base_ref || 'main' }} --depth=1 || true
          if git show origin/${{ github.base_ref || 'main' }}:backend/eval/data/gold.jsonl \
               > /tmp/gold-base.jsonl 2>/dev/null; then
            python -m eval.cli drift --baseline /tmp/gold-base.jsonl \
                                     --candidate eval/data/gold.jsonl
          else
            echo "::notice::No baseline gold set on the target branch."
          fi

  # ── Accuracy gate: only meaningful once a gold set exists ─────────────────
  accuracy-gate:
    name: Accuracy regression gate
    runs-on: ubuntu-latest
    needs: [platform-tests]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Report what can be measured
        env:
          GEMINI_API_KEY: ci-placeholder-not-real
        run: python -m eval.cli status || true

      - name: Run evaluation
        id: evaluate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f eval/data/gold.jsonl ]; then
            echo "::notice::No gold dataset — accuracy gate skipped. This is NOT a pass."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY not set — cannot run a live evaluation."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m eval.runner --dataset eval/data/gold.jsonl \
                                --json-out /tmp/run.json
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Check gates
        if: steps.evaluate.outputs.ran == 'true'
        run: |
          python -m eval.cli gate \
            --current /tmp/run.json \
            --baseline eval/data/baseline.json \
            --json-out /tmp/gates.json

      - name: Upload evaluation artefacts
        if: steps.evaluate.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ github.sha }}
          path: |
            /tmp/run.json
            /tmp/gates.json
          retention-days: 30

  # ── Schema compliance: cheap, unambiguous, hard failure ───────────────────
  schema-contract:
    name: Response schema contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: v1 client contract must not break
        env:
          GEMINI_API_KEY: ci-placeholder-not-real
        run: |
          # A removed or nulled field is a decode failure on installed clients
          # that cannot be fixed without an App Store release.
          pytest tests/test_ai_pipeline.py -k "Contract" -v --tb=short
