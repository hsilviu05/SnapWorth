name: Evaluation gates

# Quality gates for valuation changes.
#
# The platform itself is tested on every PR — that runs without a model, an API
# key or a network, so it is fast and always meaningful.
#
# The *accuracy* gate only runs when a gold dataset exists. Until then it
# reports SKIPPED, never PASSED: a green tick on an unmeasured benchmark is the
# single most dangerous output this workflow could produce, because it looks
# identical to a real pass.
#
# "Skipped" has to be decided by a job *before* the gate. A step cannot mark
# its own job skipped — the gate used to `exit 0` from inside a step when there
# was no gold set, which GitHub shows as a green success, and that is what
# every backend PR displayed while no gold file had ever existed. A job-level
# `if: hashFiles(...)` does not work either (no checkout exists yet when a
# job's `if` is evaluated), hence the `gold-check` job and its output.

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/eval.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
  # Weekly, on main: the only alarm for drift on the model's side, where
  # nothing in this repository changed (#215). Each run's run.json is kept.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      run_live_eval:
        description: 'Run the live model evaluation (costs API calls)'
        type: boolean
        default: false

jobs:
  # ── Always runs: the platform's own correctness ───────────────────────────
  platform-tests:
    name: Evaluation platform tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Test the evaluation platform
        env:
          GEMINI_API_KEY: ci-placeholder-not-real
        run: pytest tests/test_eval_platform.py tests/test_eval.py tests/test_eval_intake.py tests/test_eval_paired_experiment.py tests/test_eval_gate_wiring.py tests/test_eval_field.py tests/test_eval_fx.py -v --tb=short

  # ── Guards against fabricated benchmark data ──────────────────────────────
  data-integrity:
    name: No fabricated benchmark data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Shipped sample data must not be scoreable
        env:
          GEMINI_API_KEY: ci-placeholder-not-real
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from eval import dataset, schema

          failures = []

          v1 = dataset.load('eval/data/sample.jsonl')
          if any(i.is_scoreable for i in v1):
              failures.append('eval/data/sample.jsonl contains scoreable records')

          gold = schema.load_gold('eval/data/gold.template.jsonl')
          if any(i.is_scoreable for i in gold):
              failures.append('gold.template.jsonl contains scoreable records')

          if failures:
              print('::error::' + '; '.join(failures))
              print('Template and sample files must never contribute to a '
                    'reported metric. Add real records to eval/data/gold.jsonl.')
              sys.exit(1)
          print(f'ok: {len(v1)} sample + {len(gold)} template records, none scoreable')
          PY

      # The repo is public (#213). Labels go in git; photos, receipts and
      # screenshots go in the private store mounted at eval/data/images/, which
      # .gitignore keeps out, and evidence is a `private:<ref>`, never a web
      # address. `git add -f` gets past .gitignore, so this asks git itself.
      - name: No photos or evidence links in the public repo
        run: |
          set -euo pipefail
          tracked=$(git ls-files eval/data | grep -iE '\.(jpe?g|png|heic|heif|webp|gif|tiff?|pdf)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Images are committed under backend/eval/data/. They belong in the private gold store:"
            echo "$tracked"
            exit 1
          fi
          python - <<'PY'
          import json, pathlib, re, sys
          path = pathlib.Path('eval/data/gold.jsonl')
          if not path.exists():
              print('no gold set yet'); sys.exit(0)
          web = re.compile(r'(https?://|www\.)', re.I)
          bad = []
          for n, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              record = json.loads(line)
              if record.get('evidence_url'):
                  bad.append(f'line {n} ({record.get("id")}): evidence_url is set')
              if web.search(record.get('evidence_note') or ''):
                  bad.append(f'line {n} ({record.get("id")}): evidence_note holds a web address')
          if bad:
              print('::error::Evidence must be a private:<ref> (eval/intake.py):')
              print('\n'.join(bad)); sys.exit(1)
          print('ok: no evidence links in gold.jsonl')
          PY

      - name: Gold set label drift
        env:
          GEMINI_API_KEY: ci-placeholder-not-real
        run: |
          if [ ! -f eval/data/gold.jsonl ]; then
            echo "::notice::No gold dataset yet — drift check skipped."
            exit 0
          fi
          git fetch origin ${{ github.base_ref || 'main' }} --depth=1 || true
          if git show origin/${{ github.base_ref || 'main' }}:backend/eval/data/gold.jsonl \
               > /tmp/gold-base.jsonl 2>/dev/null; then
            python -m eval.cli drift --baseline /tmp/gold-base.jsonl \
                                     --candidate eval/data/gold.jsonl
          else
            echo "::notice::No baseline gold set on the target branch."
          fi

  # ── Can accuracy be measured at all? ──────────────────────────────────────
  gold-check:
    name: Accuracy measurable?
    runs-on: ubuntu-latest
    outputs:
      measure: ${{ steps.check.outputs.measure }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # to see which files the change touches
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Three questions, in order (#215). Does this run touch pricing? A PR
      # that changes no pricing file makes no model call and skips the gate.
      # Is there a gold set to measure against? Then: are the model key and
      # the photo token there? A same-repo pricing change without them FAILS
      # here: it would otherwise merge unmeasured with a grey tick. A fork or
      # Dependabot run gets no secrets, which its author cannot fix, so it is
      # skipped with a warning. Skipped is never shown as passed.
      #
      # `eval.cli status` is stdlib-only and reads only the public labels, so
      # it needs no install and no photos.
      - name: Scope, gold set and secrets
        id: check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOLD_READ_TOKEN: ${{ secrets.GOLD_READ_TOKEN }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          ACTOR: ${{ github.actor }}
          LIVE: ${{ github.event.inputs.run_live_eval || 'false' }}
        run: |
          set -euo pipefail
          PRICING='^backend/(prompts|valuation|confidence|aiconfig|promptsafety|imagequality|categories)\.py$|^backend/eval/'
          case "$EVENT" in
            schedule) scope=yes; why="the weekly run" ;;
            workflow_dispatch)
              if [ "$LIVE" = "true" ]; then scope=yes; why="a manual run"
              else scope=no; why="a manual run without run_live_eval"; fi ;;
            *)
              if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
                changed=$(git diff --name-only HEAD~1 HEAD)
              else
                changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
              fi
              hits=$(printf '%s\n' "$changed" | grep -E "$PRICING" | tr '\n' ' ' || true)
              if [ -n "$hits" ]; then scope=yes; why="pricing files changed ($hits)"
              else scope=no; why="no pricing file changed"; fi ;;
          esac
          if [ "$scope" != yes ]; then
            echo "::notice::Accuracy gate not needed: $why. Skipped, with no model calls."
            echo "measure=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          can=$(python -m eval.cli status \
                | python -c 'import json,sys; print(json.load(sys.stdin)["can_measure_accuracy"])')
          if [ "$can" != "True" ]; then
            echo "::notice::No headline-eligible gold records — the accuracy gate is skipped. This is NOT a pass."
            echo "measure=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          missing=""
          if [ -z "$GEMINI_API_KEY" ]; then missing=" GEMINI_API_KEY"; fi
          if [ -z "$GOLD_READ_TOKEN" ]; then missing="$missing GOLD_READ_TOKEN"; fi
          if [ -n "$missing" ]; then
            if [ "$SAME_REPO" = "true" ] && [ "$ACTOR" != "dependabot[bot]" ]; then
              echo "::error::$why and a gold set exists, but this run has no$missing. Add it under Settings → Secrets and variables → Actions: a pricing change is not merged unmeasured."
              exit 1
            fi
            echo "::warning::$why, but this run gets no$missing (a fork or Dependabot) — the accuracy gate is skipped. This is NOT a pass."
            echo "measure=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Measuring: $why."
          echo "measure=true" >> "$GITHUB_OUTPUT"

  # ── Accuracy gate: only meaningful once a gold set exists ─────────────────
  accuracy-gate:
    name: Accuracy regression gate
    runs-on: ubuntu-latest
    needs: [platform-tests, gold-check]
    # Skipped — grey, not green — whenever gold-check says there is nothing to
    # measure. Every run that gets past this line measures something real.
    if: needs.gold-check.outputs.measure == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      # The photos live in a private repository (#213): the repo is public
      # and a listing photo is the seller's. Its root holds the files the
      # intake wrote (G-0001-front.jpg, …), mounted where gold.jsonl's
      # `images/…` paths point. GOLD_REPO (a repository variable) names it.
      - name: Gold photos from the private store
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GOLD_REPO || 'hsilviu05/snapworth-gold' }}
          token: ${{ secrets.GOLD_READ_TOKEN }}
          path: backend/eval/data/images

      # A missing or edited photo would score a different image than the
      # label describes, so it fails here, before any model call.
      - name: Every gold photo is the one its record names
        run: python -m eval.cli images --path eval/data/gold.jsonl --annotate

      - name: Report what can be measured
        env:
          GEMINI_API_KEY: ci-placeholder-not-real
        run: python -m eval.cli status

      # Under the pinned production config, which run.json records; the gate
      # refuses a baseline recorded under any other (#215).
      - name: Run evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m eval.runner --dataset eval/data/gold.jsonl \
                                --config eval/data/production.json \
                                --json-out /tmp/run.json

      - name: Summary
        if: always()
        run: |
          [ -f /tmp/run.json ] || exit 0
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          run = json.load(open("/tmp/run.json"))
          m = run.get("metrics", {})
          def v(name):
              x = m.get(name, {}).get("value")
              return "—" if x is None else f"{x:.1f}"
          print("### Accuracy (gold set, production config)\n")
          print(f"Config: `{run.get('config')}`\n")
          print("| MdAPE | bias | MdAPE, midpoint | bias, midpoint | within 25% | scored |")
          print("|---|---|---|---|---|---|")
          print(f"| {v('mdape')}% | {v('bias')}% | {v('mdape_midpoint')}% | "
                f"{v('bias_midpoint')}% | {v('within_25pct')}% | {v('scored_fraction')}% |")
          PY

      # --require-measurement: a run whose every gate skipped fails rather
      # than passing. That includes the first run on a new gold set, which has
      # numbers but no baseline to compare them with — the message says to
      # commit a runner --json-out file as eval/data/baseline.json.
      - name: Check gates
        run: |
          python -m eval.cli gate \
            --current /tmp/run.json \
            --baseline eval/data/baseline.json \
            --json-out /tmp/gates.json \
            --require-measurement

      # always(): a failed gate is exactly when the numbers are wanted, and the
      # first run's run.json is the baseline to commit.
      # The weekly run's artefacts are its history: one per Monday, kept
      # for the 90 days a public repository allows. Compare them to see drift.
      - name: Upload evaluation artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'schedule' && format('evaluation-weekly-{0}', github.run_id) || format('evaluation-{0}', github.sha) }}
          path: |
            /tmp/run.json
            /tmp/gates.json
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'schedule' && 90 || 30 }}

  # ── Schema compliance: cheap, unambiguous, hard failure ───────────────────
  schema-contract:
    name: Response schema contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: v1 client contract must not break
        env:
          GEMINI_API_KEY: ci-placeholder-not-real
        run: |
          # A removed, nulled or retyped field is a decode failure on installed
          # clients that cannot be fixed without an App Store release.
          # test_contract.py compares every key and type with contract/.
          pytest tests/test_ai_pipeline.py -k "Contract" -v --tb=short
          pytest tests/test_contract.py -v --tb=short
