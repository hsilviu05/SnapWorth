name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16
        run: |
          # Pick the latest installed Xcode 16.x
          XCODE=$(ls /Applications/ | grep -E "^Xcode_16" | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$XCODE"
          xcodebuild -version

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/SnapWorth.xcodeproj \
            -scheme SnapWorth \
            -clonedSourcePackagesDirPath ~/spm-cache

      - name: Prepare iOS Simulator
        id: sim
        run: |
          echo "=== Available runtimes ==="
          xcrun simctl list runtimes
          echo "=== Available devices ==="
          xcrun simctl list devices available

          # Find an available iPhone simulator UDID
          UDID=$(xcrun simctl list devices available \
            | grep "iPhone" \
            | head -1 \
            | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' \
            || true)

          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found — creating one from installed runtime"
            RT=$(xcrun simctl list runtimes \
              | grep "iOS" \
              | grep -v "unavailable" \
              | tail -1 \
              | awk '{print $NF}')
            echo "Runtime identifier: $RT"
            UDID=$(xcrun simctl create "CI-iPhone" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-16 \
              "$RT")
            echo "Created simulator: $UDID"
          fi

          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/SnapWorth.xcodeproj \
            -scheme SnapWorth \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath ~/spm-cache \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            -quiet

  # ── Security gate: no real keys committed ───────────────────────────────────
  # ── SwiftLint (reporting only) ───────────────────────────────────────────────
  # NON-BLOCKING BY DESIGN. The codebase predates any linter, so this reports a
  # count rather than gating the build — turning it red on day one would force
  # either a mass reformat (an unreviewable diff on top of a live release) or a
  # pile of inline disables, and neither improves the app.
  #
  # The ruleset is deliberately tiny; see .swiftlint.yml for what is on and what
  # is deferred. To make this blocking later, drop the `|| true` from the lint
  # step and remove `continue-on-error`.
  lint:
    name: SwiftLint (report only)
    runs-on: macos-15
    continue-on-error: true
    env:
      # Pinned rather than `brew install swiftlint`, so the version is identical
      # in CI and locally and a clean local run means a clean build — the same
      # reasoning as the pinned gitleaks binary.
      SWIFTLINT_VERSION: 0.62.0

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          curl -sSfL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -oq /tmp/swiftlint.zip -d /tmp/swiftlint
          /tmp/swiftlint/swiftlint version

      - name: Lint and report
        run: |
          /tmp/swiftlint/swiftlint lint --config .swiftlint.yml --quiet \
            > /tmp/swiftlint.txt 2>/dev/null || true

          TOTAL=$(wc -l < /tmp/swiftlint.txt | tr -d ' ')
          ERRORS=$(grep -c ': error:' /tmp/swiftlint.txt || true)
          WARNINGS=$(grep -c ': warning:' /tmp/swiftlint.txt || true)

          {
            echo "## SwiftLint"
            echo ""
            echo "| | Count |"
            echo "|---|---|"
            echo "| Total | $TOTAL |"
            echo "| Errors | $ERRORS |"
            echo "| Warnings | $WARNINGS |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "SwiftLint: $TOTAL violations ($ERRORS errors, $WARNINGS warnings)"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftlint-report
          path: /tmp/swiftlint.txt
          if-no-files-found: ignore
          retention-days: 30

  secrets-check:
    name: No secrets in source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Scan for leaked secrets
        # Replaces two hand-written greps that matched on shape alone and could
        # not tell a credential from a redaction-test fixture. gitleaks adds
        # entropy scoring, ~170 provider rules instead of the two we thought
        # of, and scoped allowlisting — see .gitleaks.toml.
        #
        # The pinned binary rather than gitleaks-action@v2, for two reasons:
        # the action requires a paid GITLEAKS_LICENSE on organization-owned
        # repos, and running the binary means CI executes exactly the command
        # a developer runs locally, so a passing local check means a passing
        # build.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path /tmp/gitleaks.sarif \
            --no-banner
        # --redact keeps any detected value out of the public build log; the
        # finding's file and line are still reported, which is all a fix needs.

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: /tmp/gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: .env must not be tracked
        run: |
          if git ls-files --error-unmatch backend/.env 2>/dev/null; then
            echo "::error::backend/.env is tracked — rotate the API key immediately"
            exit 1
          fi
