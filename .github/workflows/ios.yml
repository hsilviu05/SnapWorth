name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16
        run: |
          # Pick the latest installed Xcode 16.x
          XCODE=$(ls /Applications/ | grep -E "^Xcode_16" | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$XCODE"
          xcodebuild -version

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/SnapWorth.xcodeproj \
            -scheme SnapWorth \
            -clonedSourcePackagesDirPath ~/spm-cache

      - name: Prepare iOS Simulator
        id: sim
        run: |
          echo "=== Available runtimes ==="
          xcrun simctl list runtimes
          echo "=== Available devices ==="
          xcrun simctl list devices available

          # Find an available iPhone simulator UDID
          UDID=$(xcrun simctl list devices available \
            | grep "iPhone" \
            | head -1 \
            | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' \
            || true)

          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found — creating one from installed runtime"
            RT=$(xcrun simctl list runtimes \
              | grep "iOS" \
              | grep -v "unavailable" \
              | tail -1 \
              | awk '{print $NF}')
            echo "Runtime identifier: $RT"
            UDID=$(xcrun simctl create "CI-iPhone" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-16 \
              "$RT")
            echo "Created simulator: $UDID"
          fi

          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/SnapWorth.xcodeproj \
            -scheme SnapWorth \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath ~/spm-cache \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            -quiet

  # ── Security gate: no real keys committed ───────────────────────────────────
  secrets-check:
    name: No secrets in source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Scan for leaked secrets
        # Replaces two hand-written greps that matched on shape alone and could
        # not tell a credential from a redaction-test fixture. gitleaks adds
        # entropy scoring, ~170 provider rules instead of the two we thought
        # of, and scoped allowlisting — see .gitleaks.toml.
        #
        # The pinned binary rather than gitleaks-action@v2, for two reasons:
        # the action requires a paid GITLEAKS_LICENSE on organization-owned
        # repos, and running the binary means CI executes exactly the command
        # a developer runs locally, so a passing local check means a passing
        # build.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path /tmp/gitleaks.sarif \
            --no-banner
        # --redact keeps any detected value out of the public build log; the
        # finding's file and line are still reported, which is all a fix needs.

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: /tmp/gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: .env must not be tracked
        run: |
          if git ls-files --error-unmatch backend/.env 2>/dev/null; then
            echo "::error::backend/.env is tracked — rotate the API key immediately"
            exit 1
          fi
