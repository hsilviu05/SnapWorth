name: iOS

# The `contract/**` and `backend/main.py|valuation.py|prompts.py` entries are
# not decoration. This workflow and backend.yml had mutually exclusive path
# filters, so a backend change to the /scan response shape ran no iOS test at
# all — eight commits since 2026-08-20 deployed exactly that way. A change to
# the response contract now runs the client's decode test, which is the only
# thing that would notice a renamed field before an installed app did.
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - '.xcode-version'
      - 'tools/swift_sanity.py'
      - 'tools/check_localization.py'
      - 'tools/build_xcstrings.py'
      - 'contract/**'
      - 'backend/main.py'
      - 'backend/valuation.py'
      - 'backend/prompts.py'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - '.xcode-version'
      - 'tools/swift_sanity.py'
      - 'tools/check_localization.py'
      - 'tools/build_xcstrings.py'
      - 'contract/**'
      - 'backend/main.py'
      - 'backend/valuation.py'
      - 'backend/prompts.py'

jobs:
  build-test:
    name: Build & Test
    # The image that carries the Xcode App Store builds are archived with —
    # see `.xcode-version` and the selection step below. `macos-15` topped out
    # at Xcode 26.3 while builds 18-20 were archived with Xcode 27 against the
    # iOS 27 SDK, so CI checked every change with a toolchain a generation
    # behind the binary that shipped: two Xcode 27-only warnings (#173, #176)
    # were fixed by hand because CI never produced them. `xcode-27` is a
    # preview label as of 2026-09 (actions/runner-images#14404) — expect
    # longer queues until it is GA, and move to its GA name when there is one.
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v7

      # The widget extension cannot import the app's module, and the app target
      # uses explicit file references while SnapWorthWidgets is a synchronised
      # folder — so the shared model is two hand-maintained copies. They had
      # already drifted once: the widget's formatter was its own and its
      # `formattedRange` lacked the empty-haul guard, so a library with no
      # scans read "$0 – $0" on the Home Screen and "$0" in the app. Nothing in
      # a build catches that, because both copies compile perfectly.
      # Runs before the 4-minute Xcode build, because the mistakes it catches
      # are the ones that cost a whole cycle to learn about. Swift has no
      # implicit adjacent-string-literal concatenation, so a message written
      # across two lines without a `+` is a compile error — easy to write and
      # invisible without a toolchain. `tools/swift_sanity.py` needs no Xcode
      # and finishes in under a second.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Swift sanity (no toolchain needed)
        run: python3 tools/swift_sanity.py ios

      # The catalogs are generated, because Xcode writes `.xcstrings` from a
      # build and there is no toolchain here to run one. Both of these fail in
      # under a second and catch what a build does not: a string the user sees
      # that is missing from the Romanian table shows in English and says
      # nothing about it, and a hand-edit of a generated catalog is silently
      # thrown away the next time the source files are built.
      - name: String catalogs match ios/Localization
        run: python3 tools/build_xcstrings.py --check

      - name: Every user-facing string is in a catalog
        run: python3 tools/check_localization.py

      - name: Widget model is in sync
        run: |
          app=ios/SnapWorth/Services/WidgetDataStore.swift
          ext=ios/SnapWorthWidgets/SnapWorthWidgets.swift
          extract() {
            awk '/BEGIN SHARED WIDGET MODEL/,/END SHARED WIDGET MODEL/' "$1"
          }
          for f in "$app" "$ext"; do
            if [ "$(extract "$f" | wc -l)" -eq 0 ]; then
              echo "::error file=$f::the shared widget model block is missing"
              exit 1
            fi
          done
          if ! diff -u <(extract "$app") <(extract "$ext"); then
            echo "::error::the shared widget model has drifted between the app and the widget extension — the diff above is what differs"
            exit 1
          fi
          echo "shared widget model identical in both targets ($(extract "$app" | wc -l) lines)"

      - name: Select the newest released Xcode, no older than .xcode-version
        run: |
          # Was pinned to Xcode_16.*, which validated the app against a
          # different toolchain generation from the one that builds the
          # binary. Newest installed rather than a hardcoded version: the
          # runner image moves, and a pin to a version that is later removed
          # fails the whole job for a reason unrelated to the change under
          # test.
          #
          # "Newest installed" alone is not enough, for two reasons.
          #
          # Betas. The Xcode 27 image carries prereleases beside the release
          # (/Applications/Xcode_27.2_beta.app), plus version-alias symlinks
          # that point at them (Xcode_27.2.app -> the beta), so sorting the
          # directory names, as this step used to, would pick a beta: an SDK
          # nobody can submit with, and its bugs reported as ours. Every name is resolved to the app it
          # really is and anything whose real path says beta is skipped.
          #
          # A silently old image. This step used to pick the newest of what
          # macos-15 had, which was Xcode 26.3, while the App Store archives
          # were built with Xcode 27 — and nothing said so. `.xcode-version`
          # records the Xcode releases are archived with; a selected major
          # below it fails here, before a build that would pass green against
          # the wrong SDK. Minor versions are allowed to differ: the image
          # moves on its own schedule and a point release is not a new SDK
          # generation. Bump `.xcode-version` when the release toolchain
          # changes.
          REQUIRED=$(tr -d '[:space:]' < .xcode-version)
          REQUIRED_MAJOR=${REQUIRED%%.*}
          XCODE=$(for app in /Applications/Xcode_*.app; do
                    real=$(realpath "$app" 2>/dev/null) || continue
                    if [[ "$real" == *[Bb]eta* ]]; then continue; fi
                    version=$(/usr/libexec/PlistBuddy \
                      -c "Print :CFBundleShortVersionString" "$real/Contents/Info.plist" \
                      2>/dev/null) || continue
                    echo "$version $real"
                  done | sort -V -u | tail -1 | cut -d' ' -f2-)
          if [ -z "$XCODE" ]; then
            echo "::error::no released Xcode found under /Applications"
            ls -la /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          SELECTED=$(xcodebuild -version | awk 'NR==1 {print $2}')
          if [ "${SELECTED%%.*}" -lt "$REQUIRED_MAJOR" ]; then
            echo "::error file=.xcode-version::CI selected Xcode $SELECTED, but App Store builds are archived with Xcode $REQUIRED. Checking with an older SDK generation than the one that ships is what this step exists to stop — move runs-on to an image that has Xcode $REQUIRED_MAJOR."
            exit 1
          fi
          echo "Xcode $SELECTED satisfies .xcode-version ($REQUIRED)"

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/SnapWorth.xcodeproj \
            -scheme SnapWorth \
            -clonedSourcePackagesDirPath ~/spm-cache

      - name: Prepare iOS Simulator
        id: sim
        run: |
          echo "=== Available runtimes ==="
          xcrun simctl list runtimes
          echo "=== Available devices ==="
          xcrun simctl list devices available

          # The NEWEST iOS runtime's iPhone, not the first row `simctl` prints.
          #
          # `head -1` took the oldest — iOS 18.5 on the macos-15 image, with
          # runtimes through 26.2 installed and unused. The shipped binary
          # targets the SDK of the Xcode in `.xcode-version`, so the tests
          # were running on a generation the App Store build never sees.
          #
          # `simctl list devices available` groups by runtime in ascending
          # order, so the last iPhone line belongs to the newest runtime.
          # `awk` on the section headers is deliberate: it survives a device
          # name containing "iOS".
          xcrun simctl list devices available \
            | awk '/^-- iOS /{rt=$0} /iPhone/{print rt" | "$0}' \
            | tail -5
          UDID=$(xcrun simctl list devices available \
            | awk '/^-- iOS /{ok=1; next} /^-- /{ok=0} ok' \
            | grep "iPhone" \
            | tail -1 \
            | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' \
            || true)

          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found — creating one from installed runtime"
            RT=$(xcrun simctl list runtimes \
              | grep "iOS" \
              | grep -v "unavailable" \
              | tail -1 \
              | awk '{print $NF}')     # newest, matching the selection above
            echo "Runtime identifier: $RT"
            UDID=$(xcrun simctl create "CI-iPhone" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-16 \
              "$RT")
            echo "Created simulator: $UDID"
          fi

          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & run unit tests
        run: |
          set -o pipefail
          # No `-quiet`. It suppressed the test counts entirely: a green run
          # printed "Testing started" and nothing else, so a suite that
          # silently stopped running most of its tests would have looked
          # identical to a healthy one. The full log goes to a file and the
          # summary step below prints what actually ran.
          # `set +e` around the pipeline, and read PIPESTATUS[0] explicitly.
          # A trailing `|| true` would have been wrong here: `true` runs as a
          # simple command and resets PIPESTATUS, so a failing build would
          # have reported success — the exact class of bug this step exists
          # to stop hiding.
          set +e
          xcodebuild test \
            -project ios/SnapWorth.xcodeproj \
            -scheme SnapWorth \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath ~/spm-cache \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee /tmp/xcodebuild.log | grep -E \
              "^(Test Suite|Test Case|.*(error|warning): |\*\* TEST|Executed )"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Test summary
        if: always()
        run: |
          echo "### iOS tests" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "Executed [0-9]+ test" /tmp/xcodebuild.log | tail -2 \
            >> "$GITHUB_STEP_SUMMARY" || echo "no test counts in the log" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "Executed [0-9]+ test" /tmp/xcodebuild.log | tail -2 || true
          # `awk NR==1`, not `head -1`: head closes the pipe after one line and
          # xcodebuild dies writing the rest, printing an NSException stack
          # trace into the summary step. awk reads to EOF, so there is nothing
          # to break. The step passed either way only because its status is
          # the last command's — a later `set -o pipefail` here would have
          # turned it red for no reason.
          xcodebuild -version | awk 'NR==1'

          xcrun simctl list devices | grep -A1 "^-- iOS" | tail -3 || true

  # ── Security gate: no real keys committed ───────────────────────────────────
  # ── SwiftLint (reporting only) ───────────────────────────────────────────────
  # NON-BLOCKING BY DESIGN. The codebase predates any linter, so this reports a
  # count rather than gating the build — turning it red on day one would force
  # either a mass reformat (an unreviewable diff on top of a live release) or a
  # pile of inline disables, and neither improves the app.
  #
  # The ruleset is deliberately tiny; see .swiftlint.yml for what is on and what
  # is deferred. To make this blocking later, drop the `|| true` from the lint
  # step and remove `continue-on-error`.
  lint:
    name: SwiftLint (report only)
    # Same image as the build, so the SourceKit that SwiftLint loads from the
    # default Xcode for its SourceKit-backed rules is the release toolchain's
    # rather than one a generation older than the code it is reading.
    runs-on: xcode-27
    continue-on-error: true
    env:
      # Pinned rather than `brew install swiftlint`, so the version is identical
      # in CI and locally and a clean local run means a clean build — the same
      # reasoning as the pinned gitleaks binary.
      SWIFTLINT_VERSION: 0.62.0

    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: |
          curl -sSfL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -oq /tmp/swiftlint.zip -d /tmp/swiftlint
          /tmp/swiftlint/swiftlint version

      - name: Lint and report
        run: |
          /tmp/swiftlint/swiftlint lint --config .swiftlint.yml --quiet \
            > /tmp/swiftlint.txt 2>/dev/null || true

          TOTAL=$(wc -l < /tmp/swiftlint.txt | tr -d ' ')
          ERRORS=$(grep -c ': error:' /tmp/swiftlint.txt || true)
          WARNINGS=$(grep -c ': warning:' /tmp/swiftlint.txt || true)

          {
            echo "## SwiftLint"
            echo ""
            echo "| | Count |"
            echo "|---|---|"
            echo "| Total | $TOTAL |"
            echo "| Errors | $ERRORS |"
            echo "| Warnings | $WARNINGS |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "SwiftLint: $TOTAL violations ($ERRORS errors, $WARNINGS warnings)"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiftlint-report
          path: /tmp/swiftlint.txt
          if-no-files-found: ignore
          retention-days: 30
