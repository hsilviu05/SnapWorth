name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is committed — remove it and rotate the API key immediately"
            exit 1
          fi

      - name: Run tests
        env:
          GEMINI_API_KEY: ci-placeholder-not-real
        run: pytest tests/ -v --tb=short --color=yes

  # ── Known-vulnerable dependencies ───────────────────────────────────────────
  # Added after an audit found five pinned packages had aged into known CVEs
  # unnoticed — python-multipart, pillow, cbor2, pyjwt and cryptography, several
  # reachable from the unauthenticated /scan and /auth/attest paths. Secret
  # scanning was already in place; nothing was watching for published advisories,
  # so drift was invisible until someone went looking.
  #
  # Scoped to requirements.txt, which is exactly what the Dockerfile installs
  # (backend/Dockerfile:24) and therefore the production attack surface. Dev-only
  # tooling is out of scope here because it never reaches a remote caller — but
  # it is not ignored: pytest's own advisory (PYSEC-2026-1845) was taken in
  # requirements-dev.txt once the production manifest was clean, so the whole
  # tree currently has no known advisory. Widening this step to
  # requirements-dev.txt is a reasonable future tightening.
  audit:
    name: No known-vulnerable dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # No --ignore-vuln entries. The seven starlette exceptions added in 80863e1
      # were removed once fastapi 0.133.0 + starlette 1.3.1 landed and fixed them
      # for real, so the allowlist is empty by design rather than by oversight.
      #
      # If a future advisory genuinely has no fix, add it here as
      #   --ignore-vuln PYSEC-XXXX-NNN  # why it is not reachable, and when to recheck
      # one ID at a time with a reason. Never suppress a whole package or drop
      # the step: an advisory with a fix available is a deploy, not an exception.
      - name: Audit production dependencies
        run: pip-audit -r requirements.txt --strict --progress-spinner off

  # ── Container builds and starts ─────────────────────────────────────────────
  # Catches the class of bug that only appears in the image: a Python version
  # drift between CI and runtime, a missing system library, or a CMD that does
  # not actually start.
  container:
    name: Container builds
    runs-on: ubuntu-latest
    env:
      # Throwaway value for the smoke checks below, held in a variable rather
      # than written inline into a `curl -H "Authorization: ..."`. The literal
      # form trips gitleaks' curl-auth-header rule, and the right answer to a
      # scanner objecting to a hardcoded credential in a curl header is to stop
      # hardcoding it, not to allowlist the pattern — an exception here would
      # apply to every future curl in this workflow, including one carrying a
      # real token.
      CI_METRICS_TOKEN: ci-metrics-token-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t snapworth-backend:ci backend/

      - name: Container starts and serves liveness
        run: |
          docker run -d --name snapworth-ci -p 8000:8000 \
            -e GEMINI_API_KEY=ci-placeholder-not-real \
            -e "METRICS_TOKEN=${CI_METRICS_TOKEN}" \
            snapworth-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live >/dev/null 2>&1; then
              echo "liveness ok after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health/live
          # /metrics now requires a bearer token, so the smoke check presents
          # the one the container was started with.
          curl -fsS -H "Authorization: Bearer ${CI_METRICS_TOKEN}" \
            http://localhost:8000/metrics | head -5

      - name: /metrics refuses anonymous callers
        run: |
          # The guard is only worth having if it actually holds in the built
          # image, not just in the unit tests. An unauthenticated scrape must
          # not return the exposition.
          STATUS=$(curl -s -o /tmp/anon-metrics -w '%{http_code}' \
            http://localhost:8000/metrics)
          if [ "$STATUS" != "404" ]; then
            echo "::error::/metrics answered anonymous caller with HTTP $STATUS"
            exit 1
          fi
          if grep -q '# TYPE' /tmp/anon-metrics; then
            echo "::error::/metrics leaked the exposition to an anonymous caller"
            exit 1
          fi
          echo "anonymous scrape correctly refused with 404"

      - name: Runs unprivileged
        run: |
          USER_ID=$(docker exec snapworth-ci id -u)
          if [ "$USER_ID" = "0" ]; then
            echo "::error::container runs as root"
            exit 1
          fi
          echo "running as uid $USER_ID"

      - name: SIGTERM triggers graceful shutdown
        run: |
          # The Dockerfile uses `exec` so uvicorn is PID 1 and receives the
          # signal. Without that the shell swallows it and in-flight scans are
          # killed on every deploy.
          docker stop --timeout 25 snapworth-ci
          if docker logs snapworth-ci 2>&1 | grep -q "shutdown complete"; then
            echo "graceful shutdown confirmed"
          else
            echo "::error::no graceful shutdown — SIGTERM did not reach uvicorn"
            docker logs snapworth-ci 2>&1 | tail -20
            exit 1
          fi

      - name: Clean up
        if: always()
        run: docker rm -f snapworth-ci || true

  # ── Deploy to Railway (main branch only, after tests pass) ──────────────────
  deploy:
    name: Deploy → Railway
    # `audit` gates the deploy too: shipping a package with a published,
    # fixed advisory is not something to discover after it is live.
    needs: [test, container, audit]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret not set — skipping deploy. Add it in GitHub repo Settings → Secrets."
            exit 0
          fi
          # Record the commit being deployed so /health can report which build
          # is live. `railway up` uploads this directory and Railway builds the
          # Dockerfile there, so a file written here rides along via `COPY . .`
          # with nothing to configure in a dashboard.
          #
          # This exists because RAILWAY_GIT_COMMIT_SHA — which the app also
          # reads — is only set by Railway's GitHub integration, never by
          # `railway up`. Without this step /health reports commit "unknown",
          # which is exactly what it did in production while the feature was
          # believed to be working.
          # Written into backend/, not the repo root: main.py looks for it
          # alongside itself, and the Docker build context is backend/, so this
          # is the path that survives `COPY . .`. The deploy job has no
          # working-directory default, unlike the other jobs in this workflow.
          echo "${GITHUB_SHA}" > backend/BUILD_COMMIT

          # `railway up` honours .gitignore, and .gitignore excludes
          # backend/BUILD_COMMIT so the file never shows up in a working tree
          # as noise. The two together silently cancelled this feature out: the
          # write above succeeded on every deploy, the file was then dropped
          # from the upload, and /health reported commit "unknown" for the
          # entire life of the feature — including while it was believed to be
          # working, which is exactly the failure it was built to prevent.
          #
          # Stripping the line from the runner's own checkout is safe: this
          # working copy is thrown away at the end of the job and is never
          # committed or pushed. The alternative, a .railwayignore, means
          # maintaining a second copy of every exclusion and letting the two
          # drift.
          grep -vxF 'backend/BUILD_COMMIT' .gitignore > .gitignore.deploy
          mv .gitignore.deploy .gitignore

          if git check-ignore -q backend/BUILD_COMMIT; then
            echo "::error::backend/BUILD_COMMIT is still ignored — it will not reach Railway"
            exit 1
          fi
          echo "deploying commit ${GITHUB_SHA}"

          railway up --service snapworth-backend --detach
