name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is committed — remove it and rotate the API key immediately"
            exit 1
          fi

      - name: Run tests
        env:
          GEMINI_API_KEY: ci-placeholder-not-real
        run: pytest tests/ -v --tb=short --color=yes

  # ── Known-vulnerable dependencies ───────────────────────────────────────────
  # Added after an audit found five pinned packages had aged into known CVEs
  # unnoticed — python-multipart, pillow, cbor2, pyjwt and cryptography, several
  # reachable from the unauthenticated /scan and /auth/attest paths. Secret
  # scanning was already in place; nothing was watching for published advisories,
  # so drift was invisible until someone went looking.
  #
  # Scoped to requirements.txt, which is exactly what the Dockerfile installs
  # (backend/Dockerfile:24) and therefore the production attack surface. Dev-only
  # tooling is deliberately out of scope: pytest currently carries
  # PYSEC-2026-1845, a local /tmp privilege issue on shared UNIX hosts that needs
  # a major 8.x -> 9.x bump. It never ships in the image and cannot be reached by
  # a remote caller, so forcing that bump to keep this job green would be
  # churning the test harness for no security gain. Track it separately.
  audit:
    name: No known-vulnerable dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # Every advisory below is named individually. There is no package-level or
      # blanket suppression: any NEW starlette advisory, and any advisory in any
      # other package, still fails this job.
      #
      # TEMPORARY — starlette CVEs pending coordinated FastAPI upgrade (Phase 2).
      # Remove after upgrade.
      #
      # Why these are excused rather than fixed: fastapi 0.115.5 pins
      # starlette<0.42.0, so every fix version here is unreachable without also
      # bumping FastAPI. fastapi 0.133.0 is the first release to drop the
      # starlette ceiling, so the target pair is 0.133.0 + starlette 1.3.1 — an
      # 18-minor jump, and a separate reviewed change. Without this temporary
      # exception the job
      # fails, `deploy` (which needs it) is skipped, and six *already-merged*
      # dependency upgrades plus the /metrics guard stay undeployed — leaving
      # production on strictly more vulnerable code than this exception allows.
      # Production already runs starlette 0.41.3 today, so excusing these does
      # not make production worse; it unblocks the changes that make it better.
      #
      # Reachability was checked against this codebase, not assumed. Five of the
      # seven cannot be triggered here at all — the repo contains no StaticFiles,
      # no FileResponse and no HTTPEndpoint (verified by grep):
      #
      #   PYSEC-2026-1942  CVE-2025-62727  FileResponse Range header quadratic
      #                    blowup. NOT REACHABLE — no FileResponse anywhere.
      #   PYSEC-2026-2281  CVE-2026-48818  StaticFiles UNC-path SSRF, Windows
      #                    only. NOT REACHABLE — no StaticFiles, and the image is
      #                    Linux.
      #   PYSEC-2026-2280  CVE-2026-48817  HTTPEndpoint getattr method dispatch.
      #                    NOT REACHABLE — all routes are @app.get/@app.post.
      #   PYSEC-2026-161   CVE-2026-48710  Host header injected into request.url.
      #   PYSEC-2026-248   CVE-2026-54282  Request path injected into request.url.
      #                    Both LOW IMPACT here: request.url is only ever read as
      #                    `.path` (observability.py:107/116/119, main.py:198),
      #                    never reconstructed for redirects or links, and
      #                    metrics.endpoint_label maps it through a closed set so
      #                    a poisoned path cannot widen metric cardinality.
      #
      # The remaining two ARE reachable, and are accepted knowingly for the
      # duration of Phase 2:
      #
      #   PYSEC-2026-1941  CVE-2025-54121  Multipart files larger than the 1 MB
      #                    spool roll over to disk on the event loop, blocking
      #                    new connections. Reachable on /scan by ordinary large
      #                    uploads, not just malicious ones.
      #   PYSEC-2026-249   CVE-2026-54283  max_fields/max_part_size silently
      #                    ignored for application/x-www-form-urlencoded, so an
      #                    unauthenticated caller can post an unbounded urlencoded
      #                    body to /scan.
      #
      # Note the 10 MB check in main.py:789 does NOT mitigate either: it runs
      # inside the handler, after starlette has already parsed the form. Both are
      # denial-of-service, not data disclosure or auth bypass. They are already
      # live in production today.
      - name: Audit production dependencies
        run: |
          pip-audit -r requirements.txt --strict --progress-spinner off \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281

  # ── Container builds and starts ─────────────────────────────────────────────
  # Catches the class of bug that only appears in the image: a Python version
  # drift between CI and runtime, a missing system library, or a CMD that does
  # not actually start.
  container:
    name: Container builds
    runs-on: ubuntu-latest
    env:
      # Throwaway value for the smoke checks below, held in a variable rather
      # than written inline into a `curl -H "Authorization: ..."`. The literal
      # form trips gitleaks' curl-auth-header rule, and the right answer to a
      # scanner objecting to a hardcoded credential in a curl header is to stop
      # hardcoding it, not to allowlist the pattern — an exception here would
      # apply to every future curl in this workflow, including one carrying a
      # real token.
      CI_METRICS_TOKEN: ci-metrics-token-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t snapworth-backend:ci backend/

      - name: Container starts and serves liveness
        run: |
          docker run -d --name snapworth-ci -p 8000:8000 \
            -e GEMINI_API_KEY=ci-placeholder-not-real \
            -e "METRICS_TOKEN=${CI_METRICS_TOKEN}" \
            snapworth-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live >/dev/null 2>&1; then
              echo "liveness ok after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health/live
          # /metrics now requires a bearer token, so the smoke check presents
          # the one the container was started with.
          curl -fsS -H "Authorization: Bearer ${CI_METRICS_TOKEN}" \
            http://localhost:8000/metrics | head -5

      - name: /metrics refuses anonymous callers
        run: |
          # The guard is only worth having if it actually holds in the built
          # image, not just in the unit tests. An unauthenticated scrape must
          # not return the exposition.
          STATUS=$(curl -s -o /tmp/anon-metrics -w '%{http_code}' \
            http://localhost:8000/metrics)
          if [ "$STATUS" != "404" ]; then
            echo "::error::/metrics answered anonymous caller with HTTP $STATUS"
            exit 1
          fi
          if grep -q '# TYPE' /tmp/anon-metrics; then
            echo "::error::/metrics leaked the exposition to an anonymous caller"
            exit 1
          fi
          echo "anonymous scrape correctly refused with 404"

      - name: Runs unprivileged
        run: |
          USER_ID=$(docker exec snapworth-ci id -u)
          if [ "$USER_ID" = "0" ]; then
            echo "::error::container runs as root"
            exit 1
          fi
          echo "running as uid $USER_ID"

      - name: SIGTERM triggers graceful shutdown
        run: |
          # The Dockerfile uses `exec` so uvicorn is PID 1 and receives the
          # signal. Without that the shell swallows it and in-flight scans are
          # killed on every deploy.
          docker stop --timeout 25 snapworth-ci
          if docker logs snapworth-ci 2>&1 | grep -q "shutdown complete"; then
            echo "graceful shutdown confirmed"
          else
            echo "::error::no graceful shutdown — SIGTERM did not reach uvicorn"
            docker logs snapworth-ci 2>&1 | tail -20
            exit 1
          fi

      - name: Clean up
        if: always()
        run: docker rm -f snapworth-ci || true

  # ── Deploy to Railway (main branch only, after tests pass) ──────────────────
  deploy:
    name: Deploy → Railway
    # `audit` gates the deploy too: shipping a package with a published,
    # fixed advisory is not something to discover after it is live.
    needs: [test, container, audit]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret not set — skipping deploy. Add it in GitHub repo Settings → Secrets."
            exit 0
          fi
          railway up --service snapworth-backend --detach
