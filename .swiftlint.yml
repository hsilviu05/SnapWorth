# SwiftLint — minimal, deliberately.
#
# This is introduced as a *reporting* gate, not a formatting one. The codebase
# was written without a linter, so switching on the default ruleset would produce
# thousands of violations, and the only realistic response to that is a mass
# reformat — a diff nobody can review, landing on top of a live release, for no
# behavioural gain. The rules below are the ones where a violation usually means
# a latent bug rather than a style preference.
#
# Deliberately NOT enabled yet, and why:
#   line_length            — hundreds of hits, purely cosmetic
#   type_body_length /
#   file_length            — would flag the design system and the test files,
#                            which are long for good reasons
#   trailing_whitespace    — noise; fix opportunistically, not in one sweep
#   identifier_name        — would flag legitimate short names (id, x, y)
#
# Adding rules is cheap; removing them once people have reformatted around them
# is not. Start small and tighten deliberately.

included:
  - ios/SnapWorth
  - ios/SnapWorthWidgets
  - ios/SnapWorthTests

excluded:
  - ios/SnapWorth/Fonts
  - .build
  - DerivedData

# Start from nothing and opt in, rather than starting from the default set and
# opting out. Makes the intent of this file readable at a glance.
disabled_rules:
  - block_based_kvo
  - class_delegate_protocol
  - closing_brace
  - closure_parameter_position
  - colon
  - comma
  - comment_spacing
  - compiler_protocol_init
  - computed_accessors_order
  - control_statement
  - custom_rules
