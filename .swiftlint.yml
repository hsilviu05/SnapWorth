  - vertical_parameter_alignment
  - vertical_whitespace
  - void_function_in_ternary
  - void_return
  - xctfail_message

# The rules that stay on. Each one catches a class of real defect:
#
#   force_cast / force_try / force_unwrapping
#       The most common crash source in Swift. A `!` on a value the server
#       controls is a remote crash, not a style issue. Test code is NOT excluded
#       — the counts there are worth seeing — but force_unwrapping is only a
#       warning, partly because forcing in a test is legitimate: an unexpected
#       nil should fail the test loudly at the point of failure.
#   empty_count
#       `.count == 0` on a lazy collection can be O(n); `.isEmpty` never is.
#   implicitly_unwrapped_optional
#       Same crash class as force_unwrapping, further from the call site.
#   discarded_notification_center_observer
#       A dropped observer token leaks and can fire after deallocation.
#   weak_delegate
#       Retain cycle by construction.
#   empty_string
#       `== ""` allocates; `.isEmpty` does not.
#   overridden_super_call / unowned_variable_capture / strong_iboutlet
#       Each is a lifecycle or memory bug, not a preference.
opt_in_rules:
  - empty_count
  - empty_string
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - unowned_variable_capture
  - discarded_notification_center_observer
  - weak_delegate

force_cast: error
force_try: error
# Warning, not error, in this first pass: test code legitimately force-unwraps —
# an unexpected nil should fail the test loudly at the point of failure, which is
# exactly what `!` does there — and the count in app code needs to be seen before
# it is made blocking.
force_unwrapping: warning
implicitly_unwrapped_optional: warning
