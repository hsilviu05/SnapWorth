  <style>
    /* Self-contained on purpose: a 404 page must not depend on anything that
       might itself be missing. Same tokens as index.html and support.html;
       the two custom faces are loaded from /fonts so the page still matches
       the site, with system fallbacks if they do not arrive. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @font-face { font-family: 'Fraunces'; src: url('/fonts/fraunces-latin.woff2') format('woff2'); font-weight: 300 900; font-display: swap; }
    @font-face { font-family: 'DM Sans'; src: url('/fonts/dmsans-latin.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }
    :root {
      color-scheme: light;
      --bg: #FAF7F4; --ink: #1C1410; --ink-2: #2B211C; --terracotta: #D96C47;
      /* Terracotta as *text*: #D96C47 is 3.18:1 on --bg, under AA. The "404"
         eyebrow is 13px, which is not large text, and it was the only thing
         on the page identifying it as an error. Same values as index.html and
         support.html. `h1 em` keeps the brand tone — at clamp(34px, 6vw)
         it is large text, where 3:1 applies and 3.18 clears it. */
      --terra-text: #A94E29;
      /* Was #8B7B75 — 3.79:1 on --bg, under AA's 4.5:1, and used for the body
         copy and the whole footer. index.html had already been corrected to
         this value; this page had not. */
      --warm-gray: #6E625B; --border: #E8DDD7;
    }
    /* Same palette as index.html and support.html. `--ink` is the text colour
       here and never a background, so there is no --band to keep separate. */
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #1A1512; --ink: #F6F1ED; --ink-2: #E2D8D1; --terracotta: #E07A55;
        --terra-text: #EC8A63;
        --warm-gray: #ABA098; --border: #3A302A;
      }
    }
    html { background: var(--bg); }
    body { min-height: 100vh; display: flex; flex-direction: column; color: var(--ink-2);
           font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    nav { padding: 20px max(32px, env(safe-area-inset-left)); }
    .logo { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px;
            color: var(--ink); text-decoration: none; letter-spacing: -0.3px; }
    main { flex: 1; display: grid; place-items: center; padding: 40px 24px 80px; text-align: center; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
               color: var(--terra-text); margin-bottom: 14px; }
    h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(34px, 6vw, 56px);
         line-height: 1.05; letter-spacing: -1px; color: var(--ink); margin-bottom: 18px; }
    h1 em { font-style: italic; font-weight: 400; color: var(--terracotta); }
    p { color: var(--warm-gray); max-width: 34em; margin: 0 auto 30px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-block; padding: 13px 22px; border-radius: 999px; font-weight: 600;
           text-decoration: none; font-size: 15px; border: 1.5px solid var(--ink); color: var(--ink); }
    .btn.primary { background: var(--ink); color: var(--bg); }
    .btn:hover { opacity: .85; }
    footer { padding: 24px max(32px, env(safe-area-inset-left)); border-top: 1px solid var(--border);
             font-size: 14px; color: var(--warm-gray); display: flex; gap: 20px; flex-wrap: wrap; }
    footer a { color: var(--warm-gray); text-decoration: none; }
    footer a:hover { color: var(--ink); }
  
    /* Keyboard focus, brand selection and balanced headings — index.html had
       all three and these pages had none of them. */
    a:focus-visible, button:focus-visible, summary:focus-visible {
      outline: 2px solid var(--terracotta);
      outline-offset: 3px;
      border-radius: 6px;
    }
    ::selection { background: #A94E29; color: #fff; }

    /* Tag beside the headline, flipped to "$0" on a click (tag.js). His box
       is reserved by aspect-ratio, so nothing moves when he paints. The
       cream edge is for dark surfaces, so it shows only in dark mode, where
       the ground shadow would not. The bubble is decoration: aria-hidden. */
    .nf-head { display: flex; align-items: center; justify-content: center; gap: 22px;
               flex-wrap: wrap; margin-bottom: 18px; }
    .nf-head h1 { margin: 0; flex: 0 1 auto; }
    .tag-wrap { position: relative; flex: none; }
    /* Width stated as well as aspect-ratio: WebKit sized .tag-wrap by the
       SVG's default 300px intrinsic width otherwise. */
    .tag-mascot { --tag-h: clamp(88px, 16vw, 132px); display: block; height: var(--tag-h);
                  width: calc(var(--tag-h) * 137.5 / 160); aspect-ratio: 137.5 / 160;
                  padding: 0; border: 0; background: none; cursor: pointer; border-radius: 18px;
                  -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .tag-mascot svg { display: block; width: 100%; height: 100%; }
    .tag-mascot:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 4px; }
    .tag-404 .tag-edge { display: none; }
    @media (prefers-color-scheme: dark) {
      .tag-404 .tag-edge { display: inline; }
      .tag-404 .tag-shadow { display: none; }
    }
    .tag-bubble { position: absolute; bottom: calc(100% + 6px); left: 50%; z-index: 2;
                  transform: translate(-50%, 4px); opacity: 0; pointer-events: none; white-space: nowrap;
                  background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 600;
                  line-height: 1.3; padding: 7px 12px; border-radius: 12px; }
    .tag-bubble::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -6px;
                         border: 6px solid transparent; border-top-color: var(--ink); }
    .tag-bubble.is-on { opacity: 1; transform: translate(-50%, 0); }
    @media (prefers-reduced-motion: no-preference) {
      .tag-bubble { transition: opacity .18s ease, transform .18s ease; }
    }
    h1, h2 { text-wrap: balance; }
    p { text-wrap: pretty; }
</style>
